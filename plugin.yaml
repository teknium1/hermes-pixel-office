name: pixel-office
version: "1.3.0"
description: "Pixel-art virtual office for Hermes — every agent and subagent becomes an animated pixel character at a desk. Live office with a GitHub-username leaderboard (free Cloudflare relay, works on any network), 500-tier ladder, office chat, approvals, and sounds. Visual only; observes lifecycle hooks, never blocks or transforms anything."
author: "NousResearch"
hooks:
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - on_session_start
  - on_session_end
  - pre_approval_request
  - post_approval_response
  - pre_llm_call
